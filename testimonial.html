    .btn { display: inline-block; font-family: var(--font-body); font-size: 0.95rem; font-weight: 500; letter-spacing: 0.04em; padding: 16px 36px; border-radius: 6px; border: none; cursor: pointer; text-decoration: none; text-align: center; transition: background .2s ease; }
    .btn--primary { background: var(--accent); color: var(--white); }
    .btn--primary:hover { background: var(--accent-hover); }
    .btn--primary:disabled { opacity: .6; cursor: default; }
    .btn--outline { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); padding: 10px 20px; font-size: 0.9rem; }
    .btn--outline:hover { background: rgba(200, 90, 42, 0.07); }

    .btn--file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

          camError: 'No pude encender tu cámara. Puede que tu navegador la haya bloqueado. Puedes grabar con tu teléfono y usar "Subir un video".',
          recUnsupported: 'Este navegador no puede grabar aquí. Graba con tu teléfono y usa "Subir un video".',
          tooBig: 'Este video pesa más de 50 MB, demasiado para este formulario. Grábalo aquí en la página, que genera un archivo más liviano, o mándamelo por WhatsApp.',
          badType: 'No puedo recibir este tipo de archivo aquí. Usa MP4, MOV o WebM, o mándamelo por WhatsApp.',
          appearH: 'Cómo apareces',
          displayQ: 'Si esto va en mi página, ¿cómo te nombro?',
          dFull: 'Nombre completo y profesión',
          dFirst: 'Nombre y profesión',
          dInitials: 'Iniciales y profesión',
          dRole: 'Solo profesión y país',
          dAnon: 'Anónimo',
          roleQ: 'Tu profesión y país',
          rolePh: 'Abogada, México',
          socialOk: 'También se puede compartir en LinkedIn, Instagram o Substack.',
          referenceOk: 'Estoy abierto o abierta a una charla corta con alguien que esté decidiendo si trabajar con Anna.',
          noteQ: '¿Algo que quieras decirme solo a mí?',
          noteHint: 'Esto nunca se publica. Lo que podría haber sido mejor también es muy bienvenido aquí.',
          promise: 'Te mando la versión final antes de publicar nada. Puede que la acorte, y no voy a cambiar lo que quisiste decir. Si más adelante cambias de opinión, me avisas y la quito.',
          submit: 'Enviar a Anna',
          uploading: 'Subiendo tu video. Por favor deja esta página abierta.',
          sending: 'Enviando',
          needContent: 'Por favor responde al menos una pregunta, o agrega un video.',
          sendError: 'Algo falló de mi lado. Tus palabras siguen aquí. Inténtalo de nuevo en un minuto, o escríbeme y lo resuelvo.',
          thanksH: 'Gracias.',
          thanksP: 'Ya me llegó. Lo voy a leer con calma y te mando la versión final. No se publica nada antes de tu sí.',
          shareH: 'Una cosa más, solo si te viene alguien a la mente',
          shareP: 'Si una amiga o un colega está en medio de un gran cambio, esta nota es tuya para enviar. No hace falta que digas que trabajaste conmigo.',
          shareNote: 'Pensé en ti. Anna Milaeva es una coach que trabaja con personas en medio de un gran cambio, usando Sistemas de Familia Interna (IFS). La primera llamada es gratis, 30 minutos, sin compromiso. Por si te sirve: ',
          copy: 'Copiar la nota',
          copied: 'Copiada',
          whatsapp: 'Enviar por WhatsApp',
          teamP: 'Y si a tu equipo le serviría esto, también hago ese trabajo.',
          teamLink: 'Ver FINO',
          closing: '"Cada parte de ti tiene una razón para estar ahí. Nada necesita ser eliminado. Todo tiene un regalo que ofrecer."',
          privacy: 'Este enlace es solo para ti y funciona una vez. Lo que envías se guarda en privado para Anna, y nada aparece en ningún lado hasta que lo apruebes.',
          closedH: 'Este enlace no está activo.',
          closedP: 'Puede que ya se haya usado o que haya vencido. Escríbeme y te mando uno nuevo.'
        }
      };

      var $ = function (id) { return document.getElementById(id); };
      var lang = new URLSearchParams(location.search).get('lang') === 'es' ? 'es' : 'en';
      var rating = null;
      var video = null;       // { blob, ext, type }
      var videoUploaded = false;
      var firstName = '';
      var recordingStream = null;
      var recorder = null;
      var recTimer = null;

      function t(key) { return T[lang][key]; }

      function shareText() { return t('shareNote') + (lang === 'es' ? 'https://annamilaeva.com/es/?utm_source=client-referral' : SITE_LINK); }

      function applyLang() {
        document.documentElement.lang = lang;
        document.title = t('title');
        document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
        if (firstName) document.querySelector('.hero h1').textContent = t('h1').replace(/\.$/, ', ' + firstName + '.');
        document.querySelectorAll('[data-tp]').forEach(function (el) { el.placeholder = t(el.getAttribute('data-tp')); });
        document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false'); });
        document.querySelectorAll('#stars .star').forEach(function (b, i) { b.setAttribute('aria-label', (i + 1) + t('starLabel')); });
        $('shareNote').textContent = shareText();
        $('whatsapp').href = 'https://wa.me/?text=' + encodeURIComponent(shareText());
      }

      document.querySelectorAll('[data-lang]').forEach(function (b) {
        b.addEventListener('click', function () { lang = b.getAttribute('data-lang'); applyLang(); });
      });

      // Offers
      OFFERS.forEach(function (o) {
        var label = document.createElement('label');
        label.className = 'chip';
        var input = document.createElement('input');
        input.type = 'checkbox';
        input.value = o[0];
        var span = document.createElement('span');
        span.setAttribute('data-t', o[1]);
        label.appendChild(input);
        label.appendChild(span);
        $('offers').appendChild(label);
      });

      // Stars
      for (var i = 1; i <= 5; i++) {
        (function (n) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'star';
          b.setAttribute('aria-pressed', 'false');
          b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.5l-5.8 3 1.1-6.5L2.6 9.4l6.5-.9z" stroke-linejoin="round"/></svg>';
          b.addEventListener('click', function () { rating = rating === n ? null : n; paintStars(); });
          $('stars').appendChild(b);
        })(i);
      }
      function paintStars() {
        document.querySelectorAll('#stars .star').forEach(function (b, idx) {
          b.classList.toggle('on', rating !== null && idx < rating);
          b.setAttribute('aria-pressed', rating === idx + 1 ? 'true' : 'false');
        });
      }

      // Tabs
      function selectTab(which) {
        var write = which === 'write';
        $('tabWrite').setAttribute('aria-selected', String(write));
        $('tabVideo').setAttribute('aria-selected', String(!write));
        $('panelWrite').hidden = !write;
        $('panelVideo').hidden = write;
      }
      $('tabWrite').addEventListener('click', function () { selectTab('write'); });
      $('tabVideo').addEventListener('click', function () { selectTab('video'); });

      // Video
      function videoMsg(key) {
        $('videoMsg').hidden = !key;
        $('videoMsg').textContent = key ? t(key) : '';
      }
      function stopStream() {
        if (recordingStream) { recordingStream.getTracks().forEach(function (tr) { tr.stop(); }); recordingStream = null; }
      }
      function showButtons(state) {
        $('camOn').hidden = state !== 'idle';
        $('uploadLabel').hidden = state !== 'idle';
        $('recStart').hidden = state !== 'live';
        $('recStop').hidden = state !== 'recording';
        $('videoRemove').hidden = state !== 'review';
        $('recStatus').hidden = state !== 'recording';
        $('videoUseField').hidden = state !== 'review';
      }
      function resetVideo() {
        stopStream();
        var s = $('stage');
        s.pause();
        s.srcObject = null;
        if (s.src) { URL.revokeObjectURL(s.src); s.removeAttribute('src'); s.load(); }
        s.hidden = true;
        video = null;
        videoUploaded = false;
        $('file').value = '';
        showButtons('idle');
      }
      function reviewVideo(blob, type, ext) {
        video = { blob: blob, type: type, ext: ext };
        videoUploaded = false;
        var s = $('stage');
        s.srcObject = null;
        s.classList.remove('stage--live');
        s.muted = false;
        s.controls = true;
        s.src = URL.createObjectURL(blob);
        s.hidden = false;
        showButtons('review');
      }
      function pickMime() {
        var list = ['video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
        for (var j = 0; j < list.length; j++) { if (MediaRecorder.isTypeSupported(list[j])) return list[j]; }
        return '';
      }

      $('camOn').addEventListener('click', function () {
        videoMsg(null);
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { videoMsg('recUnsupported'); return; }
        navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }, audio: true }).then(function (stream) {
          recordingStream = stream;
          var s = $('stage');
          s.controls = false;
          s.muted = true;
          s.srcObject = stream;
          s.classList.add('stage--live');
          s.hidden = false;
          s.play();
          showButtons('live');
        }).catch(function () { videoMsg('camError'); });
      });

      $('recStart').addEventListener('click', function () {
        var mime = pickMime();
        var chunks = [];
        // About 2 Mbps, so the two minute limit stays well under the 50 MB upload limit.
        recorder = new MediaRecorder(recordingStream, { mimeType: mime || undefined, videoBitsPerSecond: 2000000, audioBitsPerSecond: 96000 });
        recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
        recorder.onstop = function () {
          clearInterval(recTimer);
          stopStream();
          var type = (recorder.mimeType || mime || 'video/webm').split(';')[0];
          var ext = type === 'video/mp4' ? 'mp4' : 'webm';
          var blob = new Blob(chunks, { type: type });
          if (blob.size > MAX_BYTES) { resetVideo(); videoMsg('tooBig'); return; }
          reviewVideo(blob, type, ext);
        };
        recorder.start(1000);
        var started = Date.now();
        $('recTime').textContent = '0:00';
        recTimer = setInterval(function () {
          var sec = Math.floor((Date.now() - started) / 1000);
          $('recTime').textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
          if (sec >= MAX_SECONDS && recorder.state === 'recording') recorder.stop();
        }, 500);
        showButtons('recording');
      });

      $('recStop').addEventListener('click', function () { if (recorder && recorder.state === 'recording') recorder.stop(); });
      $('videoRemove').addEventListener('click', function () { resetVideo(); videoMsg(null); });

      $('file').addEventListener('change', function () {
        var f = this.files[0];
        videoMsg(null);
        if (!f) return;
        var exts = { 'video/mp4': 'mp4', 'video/quicktime': 'mov', 'video/webm': 'webm', 'video/x-m4v': 'm4v' };
        if (!exts[f.type]) { this.value = ''; videoMsg('badType'); return; }
        if (f.size > MAX_BYTES) { this.value = ''; videoMsg('tooBig'); return; }
        reviewVideo(f, f.type, exts[f.type]);
      });

      // Kept for this tab only, so nothing stays behind on a shared or work computer
      var DRAFT_FIELDS = ['before', 'after', 'friend', 'role', 'note'];
      function saveDraft() {
        try {
          var d = {};
          DRAFT_FIELDS.forEach(function (f) { d[f] = $(f).value; });
          sessionStorage.setItem(DRAFT_KEY, JSON.stringify(d));
        } catch (e) {}
      }
      try {
        var saved = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || 'null');
        if (saved) DRAFT_FIELDS.forEach(function (f) { if (saved[f]) $(f).value = saved[f]; });
      } catch (e) {}
      DRAFT_FIELDS.forEach(function (f) { $(f).addEventListener('input', saveDraft); });

      // Submit
      function formMsg(text) {
        $('formMsg').hidden = !text;
        $('formMsg').textContent = text || '';
      }
      function api(body) {
        body.token = TOKEN;
        return fetch(FORM_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      }
      function showClosed() {
        $('formView').hidden = true;
        $('closedView').hidden = false;
      }
      function uploadVideo() {
        return api({ action: 'upload_url', ext: video.ext }).then(function (res) {
          if (!res.ok) throw new Error('upload url ' + res.status);
          return res.json();
        }).then(function (data) {
          return new Promise(function (resolve, reject) {
            var xhr = new XMLHttpRequest();
            xhr.open('PUT', data.url);
            xhr.setRequestHeader('Content-Type', video.type);
            xhr.upload.onprogress = function (e) {
              if (e.lengthComputable) $('progressBar').style.width = Math.round((e.loaded / e.total) * 100) + '%';
            };
            xhr.onload = function () { xhr.status < 300 ? resolve() : reject(new Error('upload ' + xhr.status)); };
            xhr.onerror = function () { reject(new Error('upload network')); };
            xhr.send(video.blob);
          });
        });
      }
      var val = function (id) { var v = $(id).value.trim(); return v || null; };

      $('form').addEventListener('submit', function (e) {
        e.preventDefault();
        formMsg(null);
        var before = val('before'), after = val('after'), friend = val('friend');
        if (!before && !after && !friend && !video) { formMsg(t('needContent')); return; }

        $('submit').disabled = true;
        var step = Promise.resolve();
        if (video && !videoUploaded) {
          $('progress').hidden = false;
          $('status').hidden = false;
          $('status').textContent = t('uploading');
          step = uploadVideo().then(function () { videoUploaded = true; });
        }
        step.then(function () {
          $('status').hidden = false;
          $('status').textContent = t('sending');
          return api({
            action: 'submit',
            fields: {
              lang: lang,
              offers: Array.prototype.map.call(document.querySelectorAll('#offers input:checked'), function (c) { return c.value; }),
              rating: rating,
              before_text: before,
              after_text: after,
              friend_text: friend,
              has_video: !!video,
              video_use: document.querySelector('input[name=video_use]:checked').value,
              name_display: document.querySelector('input[name=name_display]:checked').value,
              role_country: val('role'),
              social_ok: $('social').checked,
              reference_ok: $('reference').checked,
              private_note: val('note')
            }
          });
        }).then(function (res) {
          if (res.status === 403) { showClosed(); return; }
          if (!res.ok) throw new Error('submit ' + res.status);
          try { sessionStorage.removeItem(DRAFT_KEY); } catch (err) {}
          showThanks();
        }).catch(function () {
          $('submit').disabled = false;
          $('progress').hidden = true;
          $('status').hidden = true;
          formMsg(t('sendError'));
        });
      });

      function showThanks() {
        stopStream();
        $('formView').hidden = true;
        $('thanksView').hidden = false;
        window.scrollTo(0, 0);
        $('thanksView').focus();
      }

      $('copy').addEventListener('click', function () {
        var btn = this;
        var done = function () {
          btn.textContent = t('copied');
          setTimeout(function () { btn.textContent = t('copy'); }, 2000);
        };
        if (navigator.clipboard) {
          navigator.clipboard.writeText(shareText()).then(done).catch(function () {});
        }
      });

      showButtons('idle');
      applyLang();

      // The form only opens for a live invite.
      if (!TOKEN) {
        showClosed();
      } else {
        api({ action: 'check' }).then(function (res) {
          if (!res.ok) { showClosed(); return; }
          return res.json().then(function (data) {
            firstName = data.first_name || '';
            applyLang();
            $('formView').hidden = false;
          });
        }).catch(function () { $('formView').hidden = false; });
      }
    })();
  </script>
</body>
</html>
